services:
  - type: web
    name: arcadestrike-server
    env: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: arcadestrike-db
          property: connectionString

databases:
  - name: arcadestrike-db
    databaseName: arcadestrike
    region: frankfurt
    plan: free
